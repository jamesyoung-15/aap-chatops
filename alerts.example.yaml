# Schedules for the alert tasks registered in src/aap_chatops/aap_alerts/.
#
# Per entry:
#   task            required, name of a registered alert task
#   cron            required, 5 field cron expression. The day of week field must
#                   be "*" or day names (eg. mon-fri); numbers are rejected because
#                   APScheduler counts 0 as Monday rather than Sunday.
#   timezone        optional, IANA name, defaults to the alert_timezone setting
#   channel         optional, Slack channel id, defaults to the
#                   default_alert_channel_id setting
#   catchup_minutes optional, re-run a missed occurrence if it is less than this
#                   stale. Omit to drop missed runs entirely.
#   enabled         optional, defaults to true

alerts:
  - task: pending_approvals
    cron: "0 10 * * mon-fri"
    catchup_minutes: 360
