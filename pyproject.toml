[project]
name = "aap-chatops"
version = "0.1.0"
description = "Python-based ChatOps bridge that connects chat platforms to Ansible Automation Platform (AAP)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "apscheduler>=3.11.3",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
    "slack-bolt>=1.30.0",
    "truststore>=0.10.4",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = "tests"
